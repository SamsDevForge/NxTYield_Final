name: FarmSense checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: pip install -r backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tls: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:renesas_uno@1.6.0
      - run: arduino-cli lib install "Adafruit BME280 Library@2.3.0" "OneWire@2.3.8" "DallasTemperature@4.0.6" "LiquidCrystal I2C@1.1.2" "ModbusMaster@2.0.1" "ArduinoHttpClient@0.6.2" "ArduinoJson@7.4.3"
      - run: arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi --build-property "compiler.cpp.extra_flags=-DFARMSENSE_USE_TLS=${{ matrix.tls }}" hardware/FarmSenseAI
